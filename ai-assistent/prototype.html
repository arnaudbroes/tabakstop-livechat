<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AI-assistent voor Tabakstop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #E9EEF3;
  --surface: #FFFFFF;
  --sunken: #F4F7FA;
  --ink: #16293D;
  --muted: #5A6E82;
  --faint: #8A9BAC;
  --line: #DCE4EC;
  --brand: #F78F1E;
  --brand-dark: #E27F0C;
  --cta: #C2570A;
  --cta-dark: #A84A06;
  --brand-ink: #B85A00;
  --brand-deep: #8F4300;
  --brand-soft: #FDEBD3;
  --chart-brand: #C96A00;
  --bot: #16293D;
  --bot-soft: #E6EAF0;
  --bot-line: #CBD3DD;
  --ok: #2E9E5B;
  --ok-soft: #E3F4EA;
  --bad: #B4462B;
  --bad-soft: #FBE9E4;
  --fr: #7A3D74;
  --fr-soft: #F4E7F2;
  --shadow-lg: 0 2px 6px rgba(22, 41, 61, .08), 0 18px 48px rgba(22, 41, 61, .18);
  --shadow: 0 1px 2px rgba(22, 41, 61, .06), 0 6px 18px rgba(22, 41, 61, .08);
  --display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); margin: 0; }
body {
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
  padding: 0 16px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }
.c-head :focus-visible { outline-color: var(--brand); }
.side :focus-visible { outline-color: var(--brand); }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }

.shell { max-width: 1320px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }

/* Top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.proto-label { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.proto-label h1 { font-size: 20px; font-weight: 700; }
.proto-label span { font-size: 13px; color: var(--muted); }
.back { font-size: 13px; font-weight: 600; color: var(--brand-deep); text-decoration: none; margin-bottom: 4px; }
.back:hover { text-decoration: underline; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.tabs button {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 7px;
  font-weight: 600; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--cta); color: #FFFFFF; }
.tabs button:not([aria-selected="true"]):hover { background: var(--sunken); color: var(--ink); }

/* Visitor controls */
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px;
}
.controls .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; font-size: 13px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--cta); color: #FFFFFF; font-weight: 600; }
.controls .hint { font-size: 13px; color: var(--muted); margin-left: auto; }

/* Browser frame */
.browser { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 9px 14px; background: #F1F4F7; border-bottom: 1px solid var(--line); }
.bar .dots { display: flex; gap: 6px; flex: none; }
.bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: #CFD8E1; display: block; }
.bar .url { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Faux site */
.site { position: relative; height: 660px; overflow: hidden; background: #FFFFFF; }
.site-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px; }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 20px; color: #1D3A5A; letter-spacing: -.01em; }
.wordmark span { color: var(--brand-ink); font-weight: 500; }
.site-nav nav { display: flex; gap: 22px; font-size: 14px; color: var(--brand-ink); font-weight: 500; }
.site-hero { padding: 26px 32px 0; max-width: 620px; display: flex; flex-direction: column; gap: 14px; }
.site-hero h2 { font-size: 38px; font-weight: 700; color: #1D3A5A; letter-spacing: -.01em; }
.site-hero p { font-size: 17px; color: #4B6076; line-height: 1.6; }
.site-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 30px 32px; max-width: 900px; }
.site-card { border-radius: 14px; padding: 18px; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; color: #FFFFFF; }
.site-card b { font-family: var(--display); font-size: 17px; font-weight: 600; }
.site-card span { font-size: 13px; }
.site-card.c1 { background: #AB58A2; }
.site-card.c2 { background: #1D3A5A; }
.site-card.c3 { background: var(--cta); }
.site.kanker .wordmark, .site.kanker .page-copy h2, .site.kanker .site-hero h2 { color: #2B333B; }
.site.kanker .wordmark span, .site.kanker .site-nav nav { color: #4A5663; }
.site.kanker .site-hero p, .site.kanker .page-copy p { color: #4A5663; }
.site.kanker .site-card.c1 { background: #5B6773; }
.site.kanker .site-card.c2 { background: #3B4652; }
.site.kanker .site-card.c3 { background: #E3E7EB; color: var(--ink); }
.skel { padding: 0 32px; display: flex; flex-direction: column; gap: 10px; max-width: 700px; }
.skel i { display: block; height: 10px; border-radius: 5px; background: #EDF1F5; }

/* Launcher + widget panel */
.launcher {
  position: absolute; right: 22px; bottom: 22px; z-index: 3;
  display: flex; align-items: center; gap: 10px;
  border: 0; border-radius: 999px; padding: 12px 18px 12px 14px;
  background: var(--brand); color: var(--ink); font-weight: 600; font-size: 15px;
  box-shadow: var(--shadow-lg);
}
.launcher:hover { background: var(--brand-dark); }
.launcher svg { width: 22px; height: 22px; flex: none; }
.launcher.round { padding: 14px; }
.panel {
  position: absolute; right: 22px; bottom: 92px; z-index: 4;
  width: 370px; height: calc(100% - 116px); max-height: 560px;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
  overflow: hidden; display: flex;
  transform-origin: bottom right;
  animation: pop .18s ease-out;
}
@keyframes pop { from { opacity: .4; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 620px) {
  .site-nav nav { display: none; }
  .site-hero h2 { font-size: 28px; }
  .site-cards { grid-template-columns: 1fr; }
  .site-card { min-height: 90px; }
  .panel { left: 8px; right: 8px; width: auto; bottom: 84px; height: calc(100% - 96px); }
}

/* Chat component */
.chat { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; background: var(--surface); }
.c-head { background: var(--ink); color: #FFFFFF; border-bottom: 3px solid var(--brand); padding: 14px 16px; display: flex; align-items: center; gap: 11px; flex: none; }
.c-head .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.c-head .who b { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.2; }
.c-head .who span { font-size: 12.5px; color: #D6E1EB; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 13px; flex: none; background: var(--brand); color: var(--ink); }
.c-head .hbtn { border: 1px solid rgba(255, 255, 255, .55); background: transparent; color: #FFFFFF; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; flex: none; }
.c-head .hbtn:hover { background: rgba(255, 255, 255, .14); }
.c-head .icon-btn { border: 0; background: transparent; color: #FFFFFF; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.c-head .icon-btn:hover { background: rgba(255, 255, 255, .14); }
.c-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.c-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; flex: none; background: var(--surface); }
.c-foot textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 40px; max-height: 110px; background: var(--sunken); }
.c-foot textarea:focus { background: var(--surface); }
.send { border: 0; background: var(--cta); color: #FFFFFF; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.send:hover { background: var(--cta-dark); }
.send svg { width: 18px; height: 18px; }
.ai-note { flex: none; text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 12px 8px; background: var(--surface); }
.c-body + .ai-note { border-top: 1px solid var(--line); padding-top: 7px; }
.intro { color: var(--muted); font-size: 13.5px; }
.f { display: flex; flex-direction: column; gap: 5px; }
.f label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--sunken); width: 100%; }
.f textarea { resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { background: var(--surface); }
.err { color: var(--bad); font-size: 12.5px; font-weight: 600; }
.btn { border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 600; background: var(--cta); color: #FFFFFF; }
.btn:hover { background: var(--cta-dark); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 84%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
.msg.me { background: var(--brand-soft); border: 1px solid #F6D3A8; color: var(--ink); border-bottom-right-radius: 4px; align-self: flex-end; }
.msg.bot { background: var(--bot-soft); border: 1px solid var(--bot-line); color: var(--ink); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg small { display: block; font-size: 11px; color: #44586C; margin-bottom: 2px; font-weight: 600; }
.sys { align-self: center; font-size: 12px; color: var(--muted); text-align: center; }
.thinking { align-self: flex-start; display: flex; gap: 4px; padding: 11px 13px; background: var(--bot-soft); border: 1px solid var(--bot-line); border-radius: 14px; border-bottom-left-radius: 4px; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: #5A6E82; display: block; animation: blink 1.2s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
.overlay { position: absolute; inset: 0; background: rgba(22, 41, 61, .45); display: grid; place-items: center; padding: 20px; z-index: 2; }
.dialog { background: var(--surface); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; box-shadow: var(--shadow-lg); }
.dialog b { font-family: var(--display); font-size: 16px; font-weight: 600; }
.rate-q { font-family: var(--display); font-size: 18px; font-weight: 600; line-height: 1.3; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); }
.scale button:hover { border-color: var(--brand-ink); color: var(--brand-deep); }
.scale button[aria-pressed="true"] { background: var(--cta); border-color: var(--cta); color: #FFFFFF; }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -4px; }
.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin: auto 0; padding: 12px; }
.done .ring { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.done .ring svg { width: 28px; height: 28px; }
.done b { font-family: var(--display); font-size: 18px; font-weight: 600; }
.done p { color: var(--muted); font-size: 13.5px; max-width: 30ch; overflow-wrap: anywhere; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--brand-ink); background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; white-space: normal; }
.src svg { width: 12px; height: 12px; flex: none; }
.fbk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.fbk button { border: 1px solid var(--bot-line); background: #FFFFFF; border-radius: 6px; width: 28px; height: 24px; display: grid; place-items: center; color: var(--muted); padding: 0; }
.fbk button svg { width: 14px; height: 14px; }
.fbk button:hover { color: var(--ink); border-color: var(--brand-ink); }
.fbk button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand-ink); color: var(--brand-deep); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--brand-ink); color: var(--brand-ink); background: #FFFFFF; border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; text-align: left; }
.chips button:hover { background: var(--brand-soft); color: var(--brand-deep); }
.escalate { align-self: flex-start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 92%; }
.contact-line { font-size: 12.5px; color: var(--muted); }
.c-assist { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 0; background: var(--surface); border-top: 1px solid var(--line); flex-wrap: wrap; }
.c-assist + .c-foot { border-top: 0; }
.linkbtn { border: 0; background: transparent; color: var(--brand-ink); font-weight: 700; font-size: 13px; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.c-assist span { font-size: 11.5px; color: var(--muted); }
.formnote { background: var(--bot-soft); border: 1px solid var(--bot-line); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink); }
.fine { font-size: 12px; color: var(--muted); }

/* Embed page */
.page-wrap { padding: 30px 32px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: start; max-width: 1100px; }
.page-copy { display: flex; flex-direction: column; gap: 16px; padding-top: 6px; }
.page-copy .crumb { font-size: 13px; color: var(--muted); }
.page-copy h2 { font-size: 32px; font-weight: 700; color: #1D3A5A; letter-spacing: -.01em; }
.page-copy p { font-size: 15.5px; color: #4B6076; line-height: 1.6; }
.facts { border-top: 1px solid var(--line); }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.facts div span:last-child { color: var(--muted); text-align: right; }
.embed-card { height: 580px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; }
.embed-site { height: auto; min-height: 660px; }
@media (max-width: 860px) {
  .page-wrap { grid-template-columns: 1fr; padding: 22px 18px; }
  .embed-card { height: 540px; }
}

/* Admin */
.admin { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 760px; background: var(--sunken); position: relative; }
.side { background: #16293D; color: #D6E1EB; display: flex; flex-direction: column; padding: 16px 12px; gap: 18px; min-height: 0; }
.side .brandrow { display: flex; align-items: center; gap: 9px; padding: 2px 6px; }
.side .brandrow b { font-family: var(--display); font-weight: 700; font-size: 16px; color: #FFFFFF; }
.side .brandrow span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8FA6BC; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: #C3D1DE; padding: 9px 10px; border-radius: 8px; text-align: left; font-weight: 500; }
.side nav button svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.side nav button:hover { background: rgba(255, 255, 255, .06); color: #FFFFFF; }
.side nav button[aria-current="page"] { background: rgba(255, 255, 255, .1); color: #FFFFFF; font-weight: 600; box-shadow: inset 3px 0 0 var(--brand); }
.side nav .badge { margin-left: auto; background: var(--cta); color: #FFFFFF; font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

.pane { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.pane-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pane-head h2 { font-size: 22px; font-weight: 700; margin-right: auto; }
.sample { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 6px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; min-width: 0; flex: 1 1 240px; max-width: 360px; }
.search svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
.search input { border: 0; background: transparent; padding: 8px 0; width: 100%; min-width: 0; }
.search input:focus { outline: none; }
.search:focus-within { outline: 2px solid var(--brand-ink); outline-offset: 1px; }
.chip { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: var(--bot-soft); color: var(--bot); flex: none; }
.chip.fr { background: var(--fr-soft); color: var(--fr); }

.archive-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; min-height: 0; align-items: start; }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid #EEF2F6; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 180px; color: var(--muted); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--sunken); }
tbody tr[aria-selected="true"] { background: var(--brand-soft); }
tbody tr:last-child td { border-bottom: 0; }
.ops td, .ops tbody tr { cursor: default; }
.ops tbody tr:hover { background: transparent; }
.score { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.score i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.st { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
.st.solved { background: var(--ok-soft); color: #1F6B3E; }
.st.left { background: var(--brand-soft); color: var(--brand-deep); }
.st.unanswered { background: var(--bad-soft); color: var(--bad); }
.transcript { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; max-height: 600px; }
.transcript .th { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.transcript .th b { font-family: var(--display); font-weight: 600; font-size: 16px; }
.transcript .th span { font-size: 12.5px; color: var(--muted); }
.transcript .tb { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.transcript .tb .msg { font-size: 13px; max-width: 92%; }

.kpi .v small { font-size: 15px; font-weight: 600; color: var(--muted); }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.warn .v { color: var(--bad); }
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 600; }
.card .sub { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dist { display: flex; flex-direction: column; gap: 8px; }
.dist .row { display: grid; grid-template-columns: 22px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.dist .row b { font-family: var(--display); font-weight: 600; text-align: center; }
.dist .track { height: 12px; border-radius: 6px; background: #EEF2F6; overflow: hidden; }
.dist .fill { height: 100%; border-radius: 6px; background: var(--chart-brand); }
.dist .row span:last-child { text-align: right; color: var(--muted); }
.topics .row { grid-template-columns: minmax(120px, 190px) 1fr 34px; }
.topics .row b { font-family: var(--body); font-weight: 500; text-align: left; font-size: 13px; }
.avg { display: flex; align-items: baseline; gap: 8px; }
.avg b { font-family: var(--display); font-size: 30px; font-weight: 700; }
.avg span { color: var(--muted); font-size: 13px; }

.reviews { display: flex; flex-direction: column; gap: 12px; max-width: 820px; }
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.review .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.review .flag { font-size: 12.5px; font-weight: 700; color: var(--bad); }
.review .meta { font-size: 12.5px; color: var(--muted); margin-left: auto; }
.review .q { font-weight: 600; font-size: 15px; }

.review .a small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #44586C; margin-bottom: 3px; }
.review .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.review label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.review.is-done { background: var(--sunken); }
.review.is-done .q { color: var(--muted); font-weight: 500; }
.review .who { font-weight: 700; font-size: 14px; }
.review .attached { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.review .attached .msg { font-size: 13px; max-width: 92%; }
.check-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px 6px 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
.check-btn:hover { border-color: var(--brand-ink); color: var(--ink); }

.check-btn[aria-pressed="true"] .box { background: var(--cta); border-color: var(--cta); color: #FFFFFF; }
.toggle-link { border: 0; background: none; color: var(--brand-deep); font-weight: 600; font-size: 13px; padding: 2px; }
.toggle-link:hover { text-decoration: underline; }
.subtabs { display: inline-flex; }
.kb-note { font-size: 13px; color: var(--muted); max-width: 70ch; }
.status-pill { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; }
.status-pill.ok { background: var(--ok-soft); color: #1F6B3E; }
.status-pill.busy { background: var(--brand-soft); color: var(--brand-deep); }
.status-pill.busy::before { content: ""; width: 9px; height: 9px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.provs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.prov { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }

    /* Conversations archive */

        (cards ? '<div class="reviews">' + cards + '</div>' : '<div class="card"><p class="no-results">Er zijn nog geen berichten.</p></div>') + '</div>';

    /* Stats */
    function seeded(n, seed) { var out = [], x = seed; for (var i = 0; i < n; i++) { x = (x * 9301 + 49297) % 233280; out.push(x / 233280); } return out; }
    function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
    var D7 = { labels: ['wo 17', 'do 18', 'vr 19', 'za 20', 'zo 21', 'ma 22', 'di 23'],
      total: [38, 41, 45, 12, 9, 43, 36], left: [4, 5, 6, 2, 1, 5, 4], unanswered: [2, 1, 2, 1, 0, 2, 1] };
    var D30 = (function () {
      var r = seeded(30, 11), o = { labels: [], total: [], left: [], unanswered: [] };
      var start = new Date(2025, 7, 25);
      for (var i = 0; i < 30; i++) {
        var d = new Date(start.getTime() + i * 86400000), wd = d.getDay(), we = wd === 0 || wd === 6;
        var t = we ? Math.round(6 + r[i] * 8) : Math.round(32 + r[i] * 16);
        o.total.push(t);
        o.left.push(Math.round(t * (0.09 + r[(i + 5) % 30] * 0.06)));
        o.unanswered.push(Math.round(t * (0.03 + r[(i + 9) % 30] * 0.04)));
        o.labels.push(d.getDate() + '/' + (d.getMonth() + 1));
      }
      return o;
    })();
    var TOPICS = [['Nicotinevervangers', 0.26], ['Ontwenning en zin in roken', 0.24], ['Begeleiding door een tabakoloog', 0.19], ['Brochures bestellen', 0.12], ['Medicatie en zwangerschap', 0.11], ['Andere vragen', 0.08]];
    DATA.tabakstop.d7 = D7; DATA.tabakstop.topics = TOPICS;
    DATA.kanker.d7 = { labels: D7.labels, total: [31, 36, 39, 10, 8, 37, 33], left: [5, 6, 7, 2, 1, 6, 5], unanswered: [1, 2, 1, 0, 1, 2, 1] };
    DATA.kanker.topics = [['Borstkanker', 0.22], ['Chemotherapie en behandeling', 0.18], ['Bevolkingsonderzoek', 0.17], ['Voeding en bewegen', 0.14], ['Werk en kanker', 0.12], ['Rouw en verlies', 0.09], ['Andere vragen', 0.08]];
    var SCORES = [0.46, 0.31, 0.13, 0.06, 0.04];

    function statsData() {
      var d = st.period === 7 ? DATA[cur].d7 : D30;
      var total = sum(d.total), left = sum(d.left), un = sum(d.unanswered), solved = total - left - un;
      var topics = DATA[cur].topics.map(function (t) { return Math.round(total * t[1]); }); topics[0] += total - sum(topics);
      var rated = Math.round(total * 0.28);
      var counts = SCORES.map(function (p) { return Math.round(rated * p); }); counts[0] += rated - sum(counts);
      var avg = sum(counts.map(function (c, i) { return c * (5 - i); })) / Math.max(1, rated);
      return { d: d, total: total, left: left, un: un, solved: solved, topics: topics, rated: rated, counts: counts, avg: avg };
    }
    function niceStep(max, ticks) { var raw = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / mag; return Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag); }
    var SEG = [['solved', '#16293D', 'Opgelost door assistent'], ['left', '#C96A00', 'Bericht achtergelaten'], ['un', '#7F90A2', 'Niet beantwoord']];
    function stackChart(d, every) {
      var W = 640, H = 240, pl = 34, pr = 8, pt = 14, pb = 28;
      var max = Math.max.apply(null, d.total.concat([1])), step = niceStep(max, 4), top = Math.ceil(max / step) * step;
      var iw = W - pl - pr, ih = H - pt - pb, n = d.total.length, bw = iw / n, g = '';
      for (var v = 0; v <= top; v += step) {
        var y = pt + ih - (v / top) * ih;
        g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#E6ECF2"/><text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#5A6E82" font-family="Figtree, sans-serif">' + v + '</text>';
      }
      var bars = '';
      for (var i = 0; i < n; i++) {
        var parts = { solved: d.total[i] - d.left[i] - d.unanswered[i], left: d.left[i], un: d.unanswered[i] };
        var x = pl + i * bw + bw * 0.18, w = bw * 0.64, yCur = pt + ih;
        SEG.forEach(function (sg) {
          var val = parts[sg[0]]; if (val <= 0) return;
          var h = (val / top) * ih; yCur -= h;
          bars += '<rect x="' + x.toFixed(1) + '" y="' + yCur.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + sg[1] + '"><title>' + d.labels[i] + ' · ' + sg[2] + ': ' + val + '</title></rect>';
        });
        if (n <= 10) bars += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (yCur - 5).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#16293D" font-family="Figtree, sans-serif">' + d.total[i] + '</text>';
        if (i % every === 0) bars += '<text x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="#5A6E82" font-family="Figtree, sans-serif">' + d.labels[i] + '</text>';
      }
      return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gesprekken per dag, per afloop">' + g + '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '" stroke="#C9D3DC"/>' + bars + '</svg>';
    }
    function statsPane() {
      var s = statsData(), fmt = function (n) { return n.toFixed(1).replace('.', ','); };
      var pctSolved = Math.round(s.solved / Math.max(1, s.total) * 100);
      var seg = [[7, '7 dagen'], [30, '30 dagen']].map(function (p) { return '<button data-period="' + p[0] + '" aria-pressed="' + (st.period === p[0]) + '">' + p[1] + '</button>'; }).join('');
      var tmax = Math.max.apply(null, s.topics);
      var topics = s.topics.map(function (v, i) {
        return '<div class="row"><b>' + DATA[cur].topics[i][0] + '</b><div class="track"><div class="fill" style="width:' + (v / tmax * 100).toFixed(1) + '%"></div></div><span>' + v + '</span></div>';
      }).join('');
      var cmax = Math.max.apply(null, s.counts);
      var scores = s.counts.map(function (v, i) {
        return '<div class="row"><b>' + (5 - i) + '</b><div class="track"><div class="fill" style="width:' + (v / cmax * 100).toFixed(1) + '%"></div></div><span>' + v + '</span></div>';
      }).join('');
      var legend = SEG.map(function (sg) { return '<span><i style="background:' + sg[1] + '"></i>' + sg[2] + '</span>'; }).join('');
      return '<div class="pane"><div class="pane-head"><h2>Statistieken</h2><span class="sample">Voorbeeldgegevens</span><div class="seg">' + seg + '</div></div>' +
        '<div class="kpis">' +
        '<div class="kpi"><span class="k">Gesprekken</span><span class="v">' + s.total + '</span><span class="s">met de assistent</span></div>' +
        '<div class="kpi"><span class="k">Opgelost door de assistent</span><span class="v">' + pctSolved + '<small>%</small></span><span class="s">' + s.solved + ' gesprekken</span></div>' +
        '<div class="kpi"><span class="k">Bericht achtergelaten</span><span class="v">' + s.left + '</span><span class="s">voor een ' + CFG[cur].role + '</span></div>' +
        '<div class="kpi warn"><span class="k">Niet beantwoord</span><span class="v">' + s.un + '</span><span class="s">bezoeker vertrok zonder antwoord of bericht</span></div>' +
        '<div class="kpi"><span class="k">Tevredenheid</span><span class="v">' + fmt(s.avg) + ' <small>/ 5</small></span><span class="s">' + s.rated + ' beoordelingen</span></div>' +
        '</div>' +
        '<div class="card chart"><h3>Gesprekken per dag</h3><div class="legend">' + legend + '</div>' + stackChart(s.d, st.period === 7 ? 1 : 5) + '<p class="sub" style="margin-top:0">De assistent is altijd beschikbaar, ook in het weekend. Berichten voor een ' + CFG[cur].role + ' worden op werkdagen beantwoord.</p></div>' +
        '<div class="charts">' +
        '<div class="card"><h3>Meest gestelde onderwerpen</h3><p class="sub">' + s.total + ' gesprekken in deze periode</p><div class="dist topics">' + topics + '</div></div>' +
        '<div class="card"><h3>Tevredenheid met de assistent</h3><div class="avg"><b>' + fmt(s.avg) + '</b><span>gemiddeld op 5 · ' + s.rated + ' scores</span></div><div class="dist">' + scores + '</div></div>' +
        '</div></div>';
    }

      var act = document.activeElement, keep = act && root.contains(act) && (act.id === 'arc-q' || act.hasAttribute('data-fix')) ? act.id : null;

    root.addEventListener('click', function (e) {

      if ((t = e.target.closest('[data-arc]'))) { st.arcSel = +t.getAttribute('data-arc'); render(); return; }
      if ((t = e.target.closest('[data-period]'))) { st.period = +t.getAttribute('data-period'); render(); return; }
      if ((t = e.target.closest('[data-aitab]'))) { st.aiTab = t.getAttribute('data-aitab'); render(); return; }
      if ((t = e.target.closest('[data-done]'))) { var dm = byId(messages, +t.getAttribute('data-done')); dm.done = !dm.done; render(); return; }
      if ((t = e.target.closest('[data-showconv]'))) { var sid0 = +t.getAttribute('data-showconv'); st.shown[sid0] = !st.shown[sid0]; render(); return; }
      if ((t = e.target.closest('[data-prov]'))) {
        var pk = t.getAttribute('data-prov');
        if (pk !== st.provider) { st.provider = pk; flash('Voorbeeld: wisselen kan zonder de rest aan te passen', 'Taalmodel: ' + PROVIDERS.filter(function (p) { return p.k === pk; })[0].n); }
        return;
      }
      if ((t = e.target.closest('[data-edit]'))) { var id = +t.getAttribute('data-edit'), r = byId(reviews, id); st.editing[id] = r.fix || ''; render(); var ta = document.getElementById('fix-' + id); if (ta) ta.focus(); return; }
      if ((t = e.target.closest('[data-cancel]'))) { delete st.editing[+t.getAttribute('data-cancel')]; render(); return; }
      if ((t = e.target.closest('[data-save]'))) {
        var sid = +t.getAttribute('data-save');
        if (!(st.editing[sid] || '').trim()) { var ta2 = document.getElementById('fix-' + sid); if (ta2) { ta2.focus(); ta2.style.borderColor = '#B4462B'; } return; }
        reviews = reviews.filter(function (x) { return x.id !== sid; }); delete st.editing[sid]; approved++;

      }
      if ((t = e.target.closest('[data-ok]'))) { var oid = +t.getAttribute('data-ok'); reviews = reviews.filter(function (x) { return x.id !== oid; }); flash('Gemarkeerd als correct', 'Het antwoord blijft ongewijzigd.'); return; }
      if ((t = e.target.closest('[data-ignore]'))) { var iid = +t.getAttribute('data-ignore'); reviews = reviews.filter(function (x) { return x.id !== iid; }); render(); return; }
      if ((t = e.target.closest('[data-act]')) && t.getAttribute('data-act') === 'reindex') {
        sources.forEach(function (x) { x.st = 'busy'; }); render();
        setTimeout(function () { sources.forEach(function (x) { x.st = 'ok'; if (x.k !== 'kb') x.upd = 'zonet'; }); if (st.page === 'ai') render(); }, 2600);
      }
    });
    root.addEventListener('input', function (e) {
      var k = e.target.getAttribute('data-bind');
      if (k === 'q') { st.q = e.target.value; render(); }
      else if (e.target.hasAttribute('data-fix')) { st.editing[+e.target.getAttribute('data-fix')] = e.target.value; e.target.style.borderColor = ''; }
    });
    root.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.hasAttribute('data-arc')) { st.arcSel = +e.target.getAttribute('data-arc'); render(); }
    });

    return {
      addMessage: function (m) {
        var id = Date.now();
        archive.unshift({ id: id, date: 'Vandaag, net', name: m.name || 'Anoniem', topic: m.question.length > 40 ? m.question.slice(0, 40) + '…' : m.question, status: 'left', dur: '—', rating: null, lang: m.lang, comment: '',
          msgs: m.msgs.concat([['sys', 'Bericht achtergelaten voor een ' + CFG[cur].role]]) });
        messages.unshift({ id: id, arc: id, date: 'Vandaag, net', name: m.name, email: m.email, lang: m.lang, question: m.question, done: false });
        if (st.started) render();
      },
      setSite: function (k) {
        DATA[cur].reviews = reviews; DATA[cur].approved = approved;
        cur = k; archive = DATA[k].archive; messages = DATA[k].messages; reviews = DATA[k].reviews; sources = DATA[k].sources; approved = DATA[k].approved;
        st.arcSel = DATA[k].arcSel; st.editing = {}; st.shown = {}; st.q = ''; st.filter = 'all'; st.toast = null; st.aiTab = 'review';
        if (st.started) render();
      },
      start: function () { st.started = true; render(); }
    };
  })();

    },
    kanker: {

      cards: [['c1', 'Over kanker', 'Soorten kanker en risicofactoren'], ['c2', 'Leven met kanker', 'Werk, voeding en nazorg'], ['c3', 'Hulp en steun', 'Praten, lotgenoten en rouw']]

  function applyHost() {
    var h = HOST[site], name = 'AI-assistent voor ' + CFG[site].name;
    ['embed', 'widget'].forEach(function (k) {
      document.getElementById(k + '-brand').innerHTML = h.brand;
      document.getElementById(k + '-nav').innerHTML = h.nav.map(function (x) { return '<span>' + x + '</span>'; }).join('');
      document.getElementById(k + '-url').textContent = h[k + 'Url'];
      document.getElementById('site-' + k).classList.toggle('kanker', site === 'kanker');
    });
    document.getElementById('embed-copy').innerHTML = h.copy;
    document.getElementById('widget-hero').innerHTML = h.hero;
    document.getElementById('widget-cards').innerHTML = h.cards.map(function (c) { return '<div class="site-card ' + c[0] + '"><b>' + c[1] + '</b><span>' + c[2] + '</span></div>'; }).join('');
    document.getElementById('admin-url').textContent = CFG[site].adminUrl;
    document.getElementById('proto-h1').textContent = name;
    document.title = name;
  }
  document.getElementById('site-seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.getAttribute('data-site') === site) return;
    site = b.getAttribute('data-site');
    widget.restart(); embed.restart(); applyHost(); Admin.setSite(site); syncControls();
  });
  applyHost();

  var initial = (location.hash || '').replace('#', '');
  show(['widget', 'embed', 'beheer'].indexOf(initial) !== -1 ? initial : 'embed');
})();
